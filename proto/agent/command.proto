syntax = "proto3";

package agent;
option go_package = "rmm-platform/proto/agent;agentpb";

message CommandRequest {
  string command_id = 1;
  string command_type = 2;
  string script_body = 3;
  repeated string args = 4;
  int32 timeout_seconds = 5;
  bool requires_approval = 6;
  string signature = 7;
}

message CommandResponse {
  string command_id = 1;
  bool success = 2;
  string output = 3;
  string error_message = 4;
  int32 exit_code = 5;
  int64 started_at_unix = 6;
  int64 finished_at_unix = 7;
}
